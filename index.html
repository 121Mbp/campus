<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#96c9a4"><title>쿼리 캠퍼스 · 새봄대학교</title><link rel="icon" type="image/svg+xml" href="src/assets/campus.svg"><link rel="stylesheet" href="src/style.css"><link rel="stylesheet" href="src/mobile.css"><link rel="stylesheet" href="src/casual.css"></head>
<body>
<header><a class="brand" href="./"><img class="brand-icon" src="src/assets/player.svg" alt="신입 조교"><span class="brand-copy"><strong>쿼리 캠퍼스</strong><small><b id="hudLevel">Lv. 1</b> 신입 조교</small><span class="hud-xp"><i id="hudXP"></i></span></span></a><div class="header-tools"><button id="fullscreen" aria-label="전체 화면 전환"><img src="src/assets/fullscreen.svg" alt=""></button><button id="sound" aria-label="효과음 켜기" aria-pressed="false"><img src="src/assets/sound.svg" alt=""></button><button id="settings" aria-label="게임 설정"><img src="src/assets/settings.svg" alt=""></button></div></header>
<main><div class="layout"><section class="game"><div class="world">
<canvas id="map" width="1056" height="640" aria-label="새봄대학교 픽셀 캠퍼스"></canvas>
<div class="location"><img src="src/assets/pin.svg" alt=""><span>새봄대학교<small>오늘도 반가워요!</small></span></div>
<button class="mapzoom" id="mapHelp" aria-label="캠퍼스 지도 안내"><img src="src/assets/map.svg" alt=""></button>
<button class="db-chip" id="dbPicker" aria-label="학습 데이터베이스 선택"><img id="dbIcon" src="src/assets/postgres.svg" alt=""><span id="dbName">PostgreSQL</span><img class="chip-arrow" src="src/assets/chevron.svg" alt=""></button>
<div class="interact" id="interact"><span class="key-bubble">E</span><span>하나와 이야기하기</span></div>
<div class="touch-controls" aria-label="캐릭터 이동 방향키"><button data-direction="w" class="up" aria-label="위로 이동"><img src="src/assets/arrow.svg" alt=""></button><button data-direction="a" class="left" aria-label="왼쪽으로 이동"><img src="src/assets/arrow.svg" alt=""></button><span class="pad-center"><img src="src/assets/paw.svg" alt=""></span><button data-direction="d" class="right" aria-label="오른쪽으로 이동"><img src="src/assets/arrow.svg" alt=""></button><button data-direction="s" class="down" aria-label="아래로 이동"><img src="src/assets/arrow.svg" alt=""></button></div>
<div class="action-controls"><button id="touchUse" aria-label="대화 또는 사용"><img src="src/assets/chat.svg" alt=""><span>이야기</span></button><button id="touchComputer" aria-label="컴퓨터 열기"><img src="src/assets/computer.svg" alt=""><span>컴퓨터</span></button></div>
<div class="controls"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동 <span>·</span><kbd>E</kbd> 이야기 / 사용</div></div>
<div class="dialogue"><button id="dialogueToggle" aria-label="대화창 접기" title="대화창 접기"><img src="src/assets/chevron.svg" alt=""></button><div class="portrait" id="portrait"><img src="src/assets/hana.svg" alt="선배 조교 하나"></div><div class="dialogue-copy"><div class="speaker">하나 <span>선배 조교</span></div><p id="dialogue">새봄대학교에 온 걸 환영해요!<br>우리 함께 첫 학기를 준비해 볼까요?</p></div><button id="talk" aria-label="하나와 대화하기"><img src="src/assets/next.svg" alt="대화하기"></button></div>
<nav aria-label="게임 메뉴"><button class="active" data-tab="campus"><img src="src/assets/campus.svg" alt=""><span>캠퍼스</span></button><button data-tab="quests"><img src="src/assets/quest.svg" alt=""><span>미션</span><small id="missionCount">1</small></button><button data-tab="notebook"><img src="src/assets/notebook.svg" alt=""><span>배움 수첩</span></button><button data-tab="bag"><img src="src/assets/plant.svg" alt=""><span>꾸미기</span></button><div class="navlevel"><span>Lv. <b id="level">1</b> 신입 조교</span><div><i id="xp"></i></div></div></nav>
</section><aside><section class="mission panel"><button id="questToggle" aria-label="미션 펼치기" aria-expanded="false"><img src="src/assets/chevron.svg" alt=""></button><div class="section-label"><span class="quest-label"><img src="src/assets/star.svg" alt="">오늘의 부탁</span><span>MAIN STORY</span></div><div class="chapter">EP. <b id="ep">01</b><span>우리의 첫 학기</span></div><h2 id="missionTitle">전산실의 첫 출근</h2><p id="missionDesc">우리 대학의 데이터베이스를 준비해요.</p><div class="tasks" id="tasks"></div><button class="primary" id="computer">같이 시작해요</button><div class="reward"><img src="src/assets/star.svg" alt="">미션 보상 <b>50 EXP · 새싹 화분</b></div></section><section class="panel journey"><div class="section-label">우리의 첫 학기 <span id="progressText">0 / 10</span></div><div class="progress"><i id="progress"></i></div></section><div class="dbstatus"><b id="serverStatus">서버 대기 중</b></div></aside></div></main>
<dialog id="modal"><div class="modalhead"><div><small id="modalLabel">CAMPUS TERMINAL</small><h2 id="modalTitle">전산실 컴퓨터</h2></div><button id="close" aria-label="닫기"><img src="src/assets/close.svg" alt=""></button></div><div id="modalBody"></div></dialog>
<script src="src/app.js"></script><script src="src/mobile.js"></script><script src="src/databases.js"></script></body></html>
